<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>问道 · 排盘历史</title>
<link rel="icon" href="./assets/paipan-icon-192.png">
<link rel="stylesheet" href="./paipan.css?v=6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="问道">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>

<header class="top">
  <div class="brand serif">问道 <em>排盘历史</em></div>
  <div class="top-right">
    <label class="skinchip"><span>皮肤</span>
      <select id="themeSel" aria-label="切换风格">
        <option value="wz">问道 · 白</option>
        <option value="ink">墨盘 · 深</option>
        <option value="paper">命书 · 纸</option>
        <option value="celadon">青绿 · 绢</option>
      </select>
    </label>
    <a id="backLink" class="back" href="paipan">返回排盘</a>
  </div>
</header>

<main class="hist-wrap">
  <div class="hist-head"><span>已存命例</span><span id="count"></span></div>
  <div id="list" class="hist-list"></div>
  <div class="hist-tools">
    <button id="clearBtn" type="button">清空全部</button>
  </div>
  <div class="note">命例存在本机浏览器，换设备不会同步。点一条即可回到排盘页打开。</div>
</main>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var HKEY = 'paipan_history_v1';

  var THEME_BG = { wz:'#ffffff', ink:'#0e1412', paper:'#f1f2ec', celadon:'#e7ece4' };
  function applyTheme(t){
    if(!THEME_BG[t]) t = 'wz';
    document.body.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', THEME_BG[t]);
    var sel = $('#themeSel');
    if(sel) sel.value = t;
    try{ localStorage.setItem('paipan_theme', t); }catch(e){}
  }
  var t = 'wz';
  try{ t = localStorage.getItem('paipan_theme') || 'wz'; }catch(e){}
  applyTheme(t);
  $('#themeSel').addEventListener('change', function(){ applyTheme(this.value); });

  // 静态站（构建时注入 manifest）→ ./index.html；工作台 → paipan
  var isStatic = !!document.querySelector('link[rel="manifest"]');
  var toApp = isStatic ? './index.html' : 'paipan';
  $('#backLink').setAttribute('href', toApp);

  function read(){
    try{ return JSON.parse(localStorage.getItem(HKEY) || '[]'); }catch(e){ return []; }
  }
  function write(arr){
    try{ localStorage.setItem(HKEY, JSON.stringify(arr)); }catch(e){}
  }

  function render(){
    var arr = read();
    $('#count').textContent = arr.length ? arr.length + ' 条' : '';
    var box = $('#list');
    if(!arr.length){
      box.innerHTML = '<div class="hist-empty">还没有保存的命例。在排盘页点「保存命例」。</div>';
      $('#clearBtn').style.display = 'none';
      return;
    }
    $('#clearBtn').style.display = '';
    box.innerHTML = arr.map(function(it, i){
      return '<div class="hrow" data-i="' + i + '">' +
        '<b>' + it.label + '</b><span>' + it.sub + '</span>' +
        '<i data-del="' + i + '" title="删除">✕</i></div>';
    }).join('');
  }

  $('#list').onclick = function(e){
    var del = e.target.closest('[data-del]');
    if(del){
      e.stopPropagation();
      var arr = read();
      arr.splice(+del.getAttribute('data-del'), 1);
      write(arr);
      render();
      return;
    }
    var el = e.target.closest('.hrow');
    if(!el) return;
    var arr = read();
    var item = arr[+el.getAttribute('data-i')];
    if(!item) return;
    try{ localStorage.setItem('paipan_open', JSON.stringify(item.form)); }catch(e){}
    location.href = toApp;
  };

  $('#clearBtn').addEventListener('click', function(){
    if(!read().length) return;
    if(!confirm('清空全部已存命例？清空后无法恢复。')) return;
    write([]);
    render();
  });

  render();
})();
</script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
}
</script>
</body>
</html>
