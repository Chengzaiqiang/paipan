<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>问道 · 八字排盘</title>
<link rel="icon" href="./assets/paipan-icon-192.png">
<link rel="stylesheet" href="./paipan.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="问道">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/paipan-icon-192.png">
</head>
<body>

<header class="top">
  <div class="brand serif">问道 <em>道法自然 · 排盘</em></div>
  <div class="top-right">
    <label class="skinchip"><span>皮肤</span>
      <select id="themeSel" aria-label="切换风格">
        <option value="wz">问道 · 白</option>
        <option value="ink">墨盘 · 深</option>
        <option value="paper">命书 · 纸</option>
        <option value="celadon">青绿 · 绢</option>
      </select>
    </label>
  </div>
</header>

<main class="wrap">
  <aside class="rail">
    <form id="form" autocomplete="off">
      <div class="grp">
        <div class="lab">历法</div>
        <div class="seg" id="calSeg">
          <button type="button" data-v="solar" class="on">公历</button>
          <button type="button" data-v="lunar">农历</button>
        </div>
      </div>

      <div class="grp">
        <div class="lab">生日</div>
        <div class="row">
          <input type="number" id="y" min="1901" max="2099" placeholder="年" aria-label="年">年
          <input type="number" id="m" min="1" max="12" placeholder="月" aria-label="月">月
          <input type="number" id="d" min="1" max="31" placeholder="日" aria-label="日">日
          <label id="leapWrap" style="display:none;color:var(--paper);font-size:11.5px;align-items:center;gap:4px">
            <input type="checkbox" id="leap">闰月
          </label>
        </div>
      </div>

      <div class="grp">
        <div class="lab">时间</div>
        <div class="row">
          <input type="number" id="hh" min="0" max="23" value="12" aria-label="时">时
          <input type="number" id="mm" min="0" max="59" value="0" aria-label="分">分
        </div>
      </div>

      <div class="grp">
        <div class="lab">性别</div>
        <div class="seg" id="sexSeg">
          <button type="button" data-v="1" class="on">男</button>
          <button type="button" data-v="0">女</button>
        </div>
      </div>

      <div class="grp">
        <div class="lab">出生地</div>
        <select id="city" aria-label="城市"></select>
        <div class="row" style="margin-top:8px">
          <input type="number" id="lon" step="0.1" min="73" max="136" value="114.3" style="width:70px" aria-label="经度">°E
          <span style="font-size:10.5px">用于真太阳时</span>
        </div>
      </div>

      <div class="grp">
        <div class="lab">口径</div>
        <div class="opts">
          <label><input type="checkbox" id="tst"> 真太阳时</label>
          <label><span class="k">晚子时</span>
            <select id="sect">
              <option value="2">日柱算当天</option>
              <option value="1">日柱算次日</option>
            </select>
          </label>
        </div>
      </div>

      <button class="go" type="submit">排盘</button>
      <div class="rail-actions">
        <button type="button" class="ghost" id="saveBtn">保存命例</button>
        <button type="button" class="ghost" id="printBtn">打印</button>
      </div>
      <a class="ghost histlink" href="history.html">历史记录</a>
    </form>
  </aside>

  <section class="stage">
    <div id="empty" class="empty">
      <div class="mark serif">盘</div>
      <p>填好生辰，按「排盘」</p>
    </div>

    <div id="result" class="hidden">
      <div class="meta" id="meta"></div>
      <div class="chart" id="chart"></div>
      <div class="aux" id="aux"></div>

      <div class="block-h"><span>大运</span><span class="hint">滑动 · 点一段看这十年</span></div>
      <div class="dayun" id="dayun"></div>

      <div class="block-h" style="margin-top:24px"><span>流年</span><span class="hint" id="lnRange"></span></div>
      <div class="liunian" id="liunian"></div>

      <div class="block-h" style="margin-top:24px"><span>流月</span><span class="hint" id="lyRange"></span></div>
      <div class="liuyue" id="liuyue"></div>

      <div class="block-h" style="margin-top:24px"><span>流日</span><span class="hint" id="lrRange"></span></div>
      <div class="liuri" id="liuri"></div>

      <div class="note">
        起运按「三天折一年」常规历法计算，体系若另有大运起运约定，需以老师说法为准；
      流月按节气（立春、惊蛰…）分月，流日为公历日。
      </div>
    </div>
  </section>
</main>

<script src="./vendor/lunar.js"></script>
<script>
(function(){
  'use strict';

  var $ = function(s){ return document.querySelector(s); };

  var GAN = '甲乙丙丁戊己庚辛壬癸';
  var ZHI = '子丑寅卯辰巳午未申酉戌亥';
  var GAN_WX = {甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};
  var ZHI_WX = {子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'};
  var GAN_YANG = {甲:1,乙:0,丙:1,丁:0,戊:1,己:0,庚:1,辛:0,壬:1,癸:0};
  var SHENG = {木:'火', 火:'土', 土:'金', 金:'水', 水:'木'};
  var KE    = {木:'土', 土:'水', 水:'火', 火:'金', 金:'木'};

  function shiShen(dayGan, other){
    var dw = GAN_WX[dayGan], ow = GAN_WX[other];
    if(!ow) return '';
    var same = GAN_YANG[dayGan] === GAN_YANG[other];
    if(dw === ow) return same ? '比肩' : '劫财';
    if(SHENG[dw] === ow) return same ? '食神' : '伤官';
    if(KE[dw] === ow) return same ? '偏财' : '正财';
    if(KE[ow] === dw) return same ? '七杀' : '正官';
    if(SHENG[ow] === dw) return same ? '偏印' : '正印';
    return '';
  }

  // 十二长生（自坐 / 星运用）
  var ZS_START = {甲:'亥',乙:'午',丙:'寅',丁:'酉',戊:'寅',己:'酉',庚:'巳',辛:'子',壬:'申',癸:'卯'};
  var ZS_DIR   = {甲:1,乙:-1,丙:1,丁:-1,戊:1,己:-1,庚:1,辛:-1,壬:1,癸:-1};
  var ZS = ['长生','沐浴','冠带','临官','帝旺','衰','病','死','墓','绝','胎','养'];
  function ziZuo(gan, zhi){
    var st = ZHI.indexOf(ZS_START[gan]);
    var i = ZHI.indexOf(zhi);
    if(st < 0 || i < 0) return '';
    var d = ((i - st) * ZS_DIR[gan]) % 12;
    if(d < 0) d += 12;
    return ZS[d];
  }

  function ssCls(name){
    if(name === '比肩' || name === '劫财') return 'ss-bj';
    if(name === '食神' || name === '伤官') return 'ss-ss';
    if(name === '偏财' || name === '正财') return 'ss-cai';
    if(name === '七杀' || name === '正官') return 'ss-gs';
    if(name === '偏印' || name === '正印') return 'ss-yin';
    return 'ss-me';
  }
  function ssHtml(name){
    return '<span class="ss ' + ssCls(name) + '">' + name + '</span>';
  }
  var SS_SHORT = {比肩:'比',劫财:'劫',食神:'食',伤官:'伤',偏财:'才',正财:'财',七杀:'杀',正官:'官',偏印:'枭',正印:'印'};
  function ssShortHtml(name){
    return '<span class="ss ' + ssCls(name) + '">' + (SS_SHORT[name] || name) + '</span>';
  }

  // 通用神煞（参考，是否采用以法本为准）
  var TIANYI  = {甲:'丑未',戊:'丑未',庚:'丑未',乙:'子申',己:'子申',丙:'亥酉',丁:'亥酉',壬:'卯巳',癸:'卯巳',辛:'寅午'};
  var WENCHANG= {甲:'巳',乙:'午',丙:'申',戊:'申',丁:'酉',己:'酉',庚:'亥',辛:'子',壬:'寅',癸:'卯'};
  var TAOJI   = {甲:'子午',乙:'子午',丙:'卯酉',丁:'卯酉',戊:'辰戌丑未',己:'辰戌丑未',庚:'寅亥',辛:'寅亥',壬:'巳申',癸:'巳申'};
  var FUXING  = {甲:'寅子',丙:'寅子',乙:'卯丑',癸:'卯丑',戊:'申',己:'申',丁:'亥',辛:'亥',庚:'午'};
  var GUOYIN  = {甲:'戌',乙:'亥',丙:'丑',丁:'寅',戊:'丑',己:'寅',庚:'辰',辛:'巳',壬:'未',癸:'申'};
  var YIMA    = {申:'寅',子:'寅',辰:'寅',寅:'申',午:'申',戌:'申',巳:'亥',酉:'亥',丑:'亥',亥:'巳',卯:'巳',未:'巳'};
  var TAOHUA  = {申:'酉',子:'酉',辰:'酉',寅:'卯',午:'卯',戌:'卯',巳:'午',酉:'午',丑:'午',亥:'子',卯:'子',未:'子'};
  var HUAGAI  = {申:'辰',子:'辰',辰:'辰',寅:'戌',午:'戌',戌:'戌',巳:'丑',酉:'丑',丑:'丑',亥:'未',卯:'未',未:'未'};

  function shenShaFor(zhi, gans, yearZhi, dayZhi){
    var out = [];
    function hit(map){
      return gans.some(function(g){ return (map[g] || '').indexOf(zhi) >= 0; });
    }
    if(hit(TIANYI)) out.push('天乙贵人');
    if(hit(WENCHANG)) out.push('文昌');
    if(hit(TAOJI)) out.push('太极贵人');
    if(hit(FUXING)) out.push('福星贵人');
    if(hit(GUOYIN)) out.push('国印贵人');
    if(YIMA[yearZhi] === zhi || YIMA[dayZhi] === zhi) out.push('驿马');
    if(TAOHUA[yearZhi] === zhi || TAOHUA[dayZhi] === zhi) out.push('桃花');
    if(HUAGAI[yearZhi] === zhi || HUAGAI[dayZhi] === zhi) out.push('华盖');
    return out;
  }

  // ---- 流月 / 流日 ----
  var MONTH_ZHI = ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
  var MONTH_CN  = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
  var JIE_NAMES = ['立春','惊蛰','清明','立夏','芒种','小暑','立秋','白露','寒露','立冬','大雪','小寒'];
  var WUHU = {甲:'丙',己:'丙',乙:'戊',庚:'戊',丙:'庚',辛:'庚',丁:'壬',壬:'壬',戊:'甲',癸:'甲'};

  function jieQiSolar(year, name){
    var t = Solar.fromYmd(year, 6, 1).getLunar().getJieQiTable();
    return t[name] || null;
  }

  function buildLiuYue(year, yearGan){
    var gi = GAN.indexOf(WUHU[yearGan]);
    var arr = [];
    for(var i = 0; i < 12; i++){
      var jieYear = i === 11 ? year + 1 : year;
      var js = jieQiSolar(jieYear, JIE_NAMES[i]);
      var start = js ? new Date(js.getYear(), js.getMonth() - 1, js.getDay()) : null;
      arr.push({
        idx: i, label: MONTH_CN[i], zhi: MONTH_ZHI[i],
        gan: GAN.charAt((gi + i) % 10), gz: GAN.charAt((gi + i) % 10) + MONTH_ZHI[i],
        jie: JIE_NAMES[i], solar: js, start: start, end: null
      });
    }
    for(var i = 0; i < 12; i++){
      if(i < 11){
        arr[i].end = arr[i + 1].start;
      } else {
        var lc = jieQiSolar(year + 1, '立春');
        arr[i].end = lc ? new Date(lc.getYear(), lc.getMonth() - 1, lc.getDay()) : null;
      }
    }
    return arr;
  }

  function buildLiuRi(m){
    var list = [];
    if(!m.start || !m.end) return list;
    var d = new Date(m.start.getTime());
    while(d < m.end){
      var l = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, d.getDate()).getLunar();
      list.push({
        dt: new Date(d.getTime()),
        md: pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
        gz: l.getDayInGanZhi(),
        gan: l.getDayGan()
      });
      d.setDate(d.getDate() + 1);
    }
    return list;
  }

  var CITIES = [
    ['北京',116.4],['上海',121.5],['广州',113.3],['深圳',114.1],['武汉',114.3],
    ['成都',104.1],['重庆',106.5],['西安',108.9],['杭州',120.2],['南京',118.8],
    ['天津',117.2],['长沙',113.0],['郑州',113.6],['济南',117.0],['合肥',117.3],
    ['福州',119.3],['厦门',118.1],['南昌',115.9],['太原',112.5],['石家庄',114.5],
    ['沈阳',123.4],['长春',125.3],['哈尔滨',126.6],['昆明',102.8],['贵阳',106.6],
    ['南宁',108.4],['海口',110.3],['兰州',103.8],['西宁',101.8],['银川',106.2],
    ['乌鲁木齐',87.6],['拉萨',91.1],['呼和浩特',111.7],['香港',114.2],['澳门',113.5],['台北',121.5]
  ];

  var state = { cal:'solar', sex:1 };
  var lastOut = null;

  (function initCities(){
    var sel = $('#city');
    CITIES.forEach(function(c){
      var o = document.createElement('option');
      o.value = String(c[1]); o.textContent = c[0] + '　' + c[1] + '°';
      sel.appendChild(o);
    });
    var o = document.createElement('option');
    o.value = ''; o.textContent = '手动输入经度';
    sel.appendChild(o);
    sel.value = '114.3';
    sel.addEventListener('change', function(){
      if(sel.value) $('#lon').value = sel.value;
      else $('#lon').focus();
    });
  })();

  function bindSeg(sel, onPick){
    var box = $(sel);
    box.addEventListener('click', function(e){
      var b = e.target.closest('button');
      if(!b) return;
      Array.prototype.forEach.call(box.querySelectorAll('button'), function(x){ x.classList.toggle('on', x === b); });
      onPick(b.getAttribute('data-v'));
    });
  }
  bindSeg('#calSeg', function(v){
    state.cal = v;
    $('#leapWrap').style.display = v === 'lunar' ? 'inline-flex' : 'none';
  });
  bindSeg('#sexSeg', function(v){ state.sex = +v; });

  // ---- 主题 ----
  var THEME_BG = { wz:'#ffffff', ink:'#0e1412', paper:'#f1f2ec', celadon:'#e7ece4' };
  function applyTheme(t){
    if(!THEME_BG[t]) t = 'wz';
    document.body.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', THEME_BG[t]);
    var sel = $('#themeSel');
    if(sel) sel.value = t;
    try{ localStorage.setItem('paipan_theme', t); }catch(e){}
  }
  (function initTheme(){
    var t = 'wz';
    try{ t = localStorage.getItem('paipan_theme') || 'wz'; }catch(e){}
    applyTheme(t);
    var sel = $('#themeSel');
    if(sel) sel.addEventListener('change', function(){ applyTheme(sel.value); });
  })();

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function eqTimeMinutes(dt){
    var start = new Date(dt.getFullYear(), 0, 1);
    var N = Math.floor((dt.getTime() - start.getTime()) / 86400000) + 1;
    var B = 2 * Math.PI * (N - 81) / 364;
    return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  }

  function readInputs(){
    var y = +$('#y').value, m = +$('#m').value, d = +$('#d').value;
    var hh = $('#hh').value === '' ? 0 : +$('#hh').value;
    var mm = $('#mm').value === '' ? 0 : +$('#mm').value;
    if(!y || !m || !d) throw new Error('请填写完整的出生年月日');
    if(y < 1901 || y > 2099) throw new Error('年份支持 1901–2099');
    if(m < 1 || m > 12) throw new Error('月份不对');
    if(d < 1 || d > 31) throw new Error('日期不对');
    if(hh < 0 || hh > 23 || mm < 0 || mm > 59) throw new Error('时间不对');
    return { y:y, m:m, d:d, hh:hh, mm:mm, leap:$('#leap').checked, lon:+$('#lon').value || 120 };
  }

  function toSolar(inp){
    if(state.cal === 'lunar'){
      var lunar = Lunar.fromYmdHms(inp.y, inp.leap ? -inp.m : inp.m, inp.d, inp.hh, inp.mm, 0);
      return lunar.getSolar();
    }
    return Solar.fromYmdHms(inp.y, inp.m, inp.d, inp.hh, inp.mm, 0);
  }

  function fmtSolar(s){
    var wk = ['日','一','二','三','四','五','六'][s.getWeek()];
    return s.getYear() + '年' + s.getMonth() + '月' + s.getDay() + '日 ' +
           pad(s.getHour()) + ':' + pad(s.getMinute()) + ' 周' + wk;
  }

  function calc(){
    var inp = readInputs();
    var baseSolar = toSolar(inp);

    var tstInfo = null;
    var solar = baseSolar;
    if($('#tst').checked){
      var dt = new Date(baseSolar.getYear(), baseSolar.getMonth() - 1, baseSolar.getDay(),
                        baseSolar.getHour(), baseSolar.getMinute(), baseSolar.getSecond());
      var lonDiff = 4 * (inp.lon - 120);
      var eot = eqTimeMinutes(dt);
      var total = lonDiff + eot;
      var dt2 = new Date(dt.getTime() + total * 60000);
      solar = Solar.fromYmdHms(dt2.getFullYear(), dt2.getMonth() + 1, dt2.getDate(),
                               dt2.getHours(), dt2.getMinutes(), dt2.getSeconds());
      tstInfo = { offset: total, lonDiff: lonDiff, eot: eot, dt: dt2 };
    }

    var lunar = solar.getLunar();
    var ec = lunar.getEightChar();
    ec.setSect(+$('#sect').value);

    var dayGan = ec.getDayGan();
    var yearGan = ec.getYearGan();
    var yearZhi = ec.getYearZhi();
    var dayZhi = ec.getDayZhi();

    var pillars = [
      { name:'年柱', gan:ec.getYearGan(),  zhi:ec.getYearZhi(),  hide:ec.getYearHideGan(),  hideSS:ec.getYearShiShenZhi(),  ss:ec.getYearShiShenGan(),  diShi:ec.getYearDiShi(),  naYin:ec.getYearNaYin(),  xunKong:ec.getYearXunKong() },
      { name:'月柱', gan:ec.getMonthGan(), zhi:ec.getMonthZhi(), hide:ec.getMonthHideGan(), hideSS:ec.getMonthShiShenZhi(), ss:ec.getMonthShiShenGan(), diShi:ec.getMonthDiShi(), naYin:ec.getMonthNaYin(), xunKong:ec.getMonthXunKong() },
      { name:'日柱', gan:ec.getDayGan(),   zhi:ec.getDayZhi(),   hide:ec.getDayHideGan(),   hideSS:ec.getDayShiShenZhi(),   ss:(state.sex ? '元男' : '元女'), diShi:ec.getDayDiShi(), naYin:ec.getDayNaYin(), xunKong:ec.getDayXunKong() },
      { name:'时柱', gan:ec.getTimeGan(),  zhi:ec.getTimeZhi(),  hide:ec.getTimeHideGan(),  hideSS:ec.getTimeShiShenZhi(),  ss:ec.getTimeShiShenGan(),  diShi:ec.getTimeDiShi(),  naYin:ec.getTimeNaYin(),  xunKong:ec.getTimeXunKong() }
    ];

    var yun = ec.getYun(state.sex);
    var daYun = yun.getDaYun();
    var dyList = [];
    for(var i = 1; i < daYun.length; i++){
      var dy = daYun[i];
      var gz = dy.getGanZhi();
      if(!gz) continue;
      dyList.push({
        ganZhi: gz,
        gan: gz.charAt(0),
        startAge: dy.getStartAge(),
        endAge: dy.getEndAge(),
        startYear: dy.getStartYear(),
        endYear: dy.getEndYear(),
        ss: shiShen(dayGan, gz.charAt(0)),
        liuNian: dy.getLiuNian().map(function(ln){
          var g = ln.getGanZhi();
          return { year: ln.getYear(), ganZhi: g, age: ln.getAge(), ss: shiShen(dayGan, g.charAt(0)) };
        })
      });
    }

    var prevJQ = lunar.getPrevJieQi(true);
    var nextJQ = lunar.getNextJieQi(true);
    var jqText = '';
    if(prevJQ && nextJQ){
      jqText = prevJQ.getName() + ' ' + prevJQ.getSolar().toYmd() + ' － ' +
               nextJQ.getName() + ' ' + nextJQ.getSolar().toYmd();
    }

    var out = {
      inp: inp, solarBase: baseSolar, solar: solar, lunar: lunar, ec: ec, pillars: pillars,
      dayGan: dayGan, yearGan: yearGan, yearZhi: yearZhi, dayZhi: dayZhi,
      yun: yun, dyList: dyList, tstInfo: tstInfo, jqText: jqText
    };
    render(out);
    return out;
  }

  function centerIn(box, sel){
    if(!box) return;
    var cur = box.querySelector(sel);
    if(!cur) return;
    var b = box.getBoundingClientRect();
    var c = cur.getBoundingClientRect();
    var rel = (c.left - b.left) + box.scrollLeft;
    box.scrollLeft = Math.max(0, rel - (box.clientWidth - c.width) / 2);
  }

  function markOverflow(){
    ['#dayun', '#liunian', '#liuyue', '#liuri'].forEach(function(sel){
      var el = $(sel);
      if(!el) return;
      var over = el.scrollWidth > el.clientWidth + 2;
      el.classList.toggle('ovf', over);
      el.classList.toggle('ovf-left', over && el.scrollLeft > 4);
      if(!el.dataset.sb){
        el.dataset.sb = '1';
        el.addEventListener('scroll', markOverflow, { passive:true });
      }
    });
  }

  var ZHI_BENQI = {子:'癸',丑:'己',寅:'甲',卯:'乙',辰:'戊',巳:'丙',午:'丁',未:'己',申:'庚',酉:'辛',戌:'戊',亥:'壬'};
  function zhiShiShen(dayGan, zhi){
    return shiShen(dayGan, ZHI_BENQI[zhi] || '');
  }
  function ssShort(name){ return SS_SHORT[name] || name; }

  // 干支竖排，干、支各标一个十神简写（支按本气藏干）
  function gzVert(gz, dayGan){
    var g = gz.charAt(0), z = gz.charAt(1);
    var gs = shiShen(dayGan, g), zs = zhiShiShen(dayGan, z);
    return '<div class="g">' +
      '<span class="gl"><i class="' + gzColor(g) + '">' + g + '</i>' +
        '<em class="ss ' + ssCls(gs) + '">' + ssShort(gs) + '</em></span>' +
      '<span class="gl"><i class="' + gzColor(z) + '">' + z + '</i>' +
        '<em class="ss ' + ssCls(zs) + '">' + ssShort(zs) + '</em></span>' +
    '</div>';
  }

  function gzColor(ch){
    return 'wx-' + (GAN_WX[ch] || ZHI_WX[ch] || '');
  }

  function render(out){
    lastOut = out;
    var ec = out.ec, pillars = out.pillars;

    // 概要
    var meta = [];
    function mi(k, v, hl){ return '<span class="mi' + (hl ? ' hl' : '') + '"><i>' + k + '</i><b>' + v + '</b></span>'; }
    meta.push(mi('公历', fmtSolar(out.solarBase), true));
    meta.push(mi('农历', out.lunar.toString() + ' · 属' + out.lunar.getYearShengXiao() + ' · ' + out.solarBase.getXingZuo() + '座'));
    if(out.tstInfo){
      meta.push(mi('真太阳时', out.tstInfo.dt.getFullYear() + '-' + pad(out.tstInfo.dt.getMonth()+1) + '-' + pad(out.tstInfo.dt.getDate()) + ' ' +
        pad(out.tstInfo.dt.getHours()) + ':' + pad(out.tstInfo.dt.getMinutes()) +
        '（经度差 ' + (out.tstInfo.lonDiff >= 0 ? '+' : '') + out.tstInfo.lonDiff.toFixed(1) +
        '，均时差 ' + (out.tstInfo.eot >= 0 ? '+' : '') + out.tstInfo.eot.toFixed(1) + ' 分）'));
    }
    if(out.jqText) meta.push(mi('节气', out.jqText));
    var sy = out.yun.getStartYear(), sm = out.yun.getStartMonth(), sd = out.yun.getStartDay();
    var firstDy = out.dyList[0];
    meta.push(mi('起运', '出生后 ' + sy + ' 年 ' + sm + ' 月 ' + sd + ' 天' +
      (firstDy ? ' · 虚岁 ' + firstDy.startAge + ' 岁 · ' + firstDy.startYear + ' 年交运' : '')));
    meta.push(mi('日主', out.dayGan + '（' + GAN_WX[out.dayGan] + '）'));
    $('#meta').innerHTML = meta.join('');

    // 四柱（清娟体系只看四柱与藏干）
    var rows = [
      { lab:'主星', cls:'ss', get:function(p){ return ssHtml(p.ss); } },
      { lab:'天干', cls:'gz big', get:function(p){ return '<span class="' + gzColor(p.gan) + '">' + p.gan + '</span>'; } },
      { lab:'地支', cls:'gz big', get:function(p){ return '<span class="' + gzColor(p.zhi) + '">' + p.zhi + '</span>'; } },
      { lab:'藏干', cls:'sm', get:function(p){
          return p.hide.map(function(h, k){
            var ss = p.hideSS[k] || '';
            return '<div class="hide-line"><span class="hz ' + gzColor(h) + '">' + h + '</span>' +
              '<span class="ss ' + ssCls(ss) + '">' + ss + '</span></div>';
          }).join('');
        } }
    ];

    var html = '<div class="ch h lab"></div>';
    pillars.forEach(function(p, i){
      html += '<div class="ch h' + (i === 2 ? ' day' : '') + '">' + p.name + '</div>';
    });
    rows.forEach(function(r, ri){
      var last = ri === rows.length - 1 ? ' last' : '';
      var labHtml = r.short ? '<span class="lf">' + r.lab + '</span><span class="sf">' + r.short + '</span>' : r.lab;
      html += '<div class="ch lab' + last + '">' + labHtml + '</div>';
      pillars.forEach(function(p, i){
        html += '<div class="ch ' + r.cls + (i === 2 ? ' dcol' : '') + last + '">' + r.get(p) + '</div>';
      });
    });
    $('#chart').innerHTML = html;

    // 辅助
    var aux = [
      ['命宫', ec.getMingGong() + '（' + ec.getMingGongNaYin() + '）'],
      ['胎元', ec.getTaiYuan() + '（' + ec.getTaiYuanNaYin() + '）'],
      ['身宫', ec.getShenGong() + '（' + ec.getShenGongNaYin() + '）'],
      ['胎息', ec.getTaiXi() + '（' + ec.getTaiXiNaYin() + '）']
    ];
    $('#aux').innerHTML = aux.map(function(a){ return '<span>' + a[0] + '<b>' + a[1] + '</b></span>'; }).join('');

    // 大运
    var now = new Date();
    var nowYear = now.getFullYear();
    var curIdx = 0;
    out.dyList.forEach(function(d, i){
      if(nowYear >= d.startYear && nowYear <= d.endYear) curIdx = i;
    });

    var selYear = null;
    var selMonthIdx = 0;
    var selDayIdx = 0;
    var curMonths = [];
    var curDays = [];
    var curLn = null;

    function inRange(dt, m){
      return m && m.start && m.end && dt >= m.start && dt < m.end;
    }
    function sameDay(a, b){
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function renderDayun(){
      $('#dayun').innerHTML = out.dyList.map(function(d, i){
        return '<div class="dy' + (i === curIdx ? ' active' : '') + '" data-i="' + i + '" role="button" tabindex="0">' +
          '<div class="age">' + d.startAge + '–' + d.endAge + ' 岁</div>' +
          gzVert(d.ganZhi, out.dayGan) +
          '<div class="yrs">' + d.startYear + '–' + d.endYear + '</div>' +
        '</div>';
      }).join('');
      renderLiunian(out.dyList[curIdx], true);
      centerIn($('#dayun'), '.active');
    }

    function renderLiunian(d, reset){
      if(!d) return;
      $('#lnRange').textContent = d.ganZhi + '运 · ' + d.startYear + '－' + d.endYear;
      var valid = d.liuNian.some(function(x){ return x.year === selYear; });
      if(reset || !valid){
        var cur = d.liuNian.filter(function(x){ return x.year === nowYear; })[0];
        selYear = (cur || d.liuNian[0]).year;
      }
      $('#liunian').innerHTML = d.liuNian.map(function(ln){
        var cls = 'ln';
        if(ln.year === nowYear) cls += ' cur';
        if(ln.year === selYear) cls += ' sel';
        return '<div class="' + cls + '" data-year="' + ln.year + '">' +
          '<div class="y">' + ln.year + ' · ' + ln.age + '岁</div>' +
          gzVert(ln.ganZhi, out.dayGan) +
        '</div>';
      }).join('');
      centerIn($('#liunian'), '.sel');
      var selLn = d.liuNian.filter(function(x){ return x.year === selYear; })[0];
      renderLiuyue(selLn);
    }

    function renderLiuyue(ln){
      if(!ln) return;
      curLn = ln;
      curMonths = buildLiuYue(ln.year, ln.ganZhi.charAt(0));
      selMonthIdx = 0;
      if(ln.year === nowYear){
        for(var i = 0; i < curMonths.length; i++){
          if(inRange(now, curMonths[i])){ selMonthIdx = i; break; }
        }
      }
      paintLiuyue();
    }

    function paintLiuyue(){
      if(!curLn) return;
      var curM = -1;
      if(curLn.year === nowYear){
        curMonths.forEach(function(m, i){ if(inRange(now, m)) curM = i; });
      }
      $('#lyRange').textContent = curLn.year + ' ' + curLn.ganZhi + '年 · 按节分月';
      $('#liuyue').innerHTML = curMonths.map(function(m, i){
        var cls = 'ly';
        if(i === curM) cls += ' cur';
        if(i === selMonthIdx) cls += ' sel';
        var md = '';
        if(m.solar){
          md = (m.solar.getYear() !== curLn.year ? m.solar.getYear() + '-' : '') +
               pad(m.solar.getMonth()) + '-' + pad(m.solar.getDay());
        }
        return '<div class="' + cls + '" data-mi="' + i + '">' +
          '<div class="m">' + m.label + '</div>' +
          gzVert(m.gz, out.dayGan) +
          '<div class="d">' + m.jie + (md ? ' ' + md : '') + '</div>' +
        '</div>';
      }).join('');
      centerIn($('#liuyue'), '.sel');
      renderLiuri(curMonths[selMonthIdx]);
      requestAnimationFrame(markOverflow);
    }

    function renderLiuri(m){
      if(!m) return;
      curDays = buildLiuRi(m);
      selDayIdx = 0;
      curDays.forEach(function(d, i){ if(sameDay(d.dt, now)) selDayIdx = i; });
      paintLiuri(m, curDays);
    }

    function paintLiuri(m, days){
      days = days || curDays;
      $('#lrRange').textContent = m.label + ' ' + m.gz + '月 · ' +
        (m.start ? (pad(m.start.getMonth() + 1) + '-' + pad(m.start.getDate())) : '') + ' 起 · ' + days.length + ' 天';
      $('#liuri').innerHTML = days.map(function(d, i){
        var cls = 'lr';
        if(sameDay(d.dt, now)) cls += ' cur';
        if(i === selDayIdx) cls += ' sel';
        return '<div class="' + cls + '" data-di="' + i + '">' +
          '<div class="y">' + d.md + '</div>' +
          gzVert(d.gz, out.dayGan) +
        '</div>';
      }).join('');
      centerIn($('#liuri'), '.sel');
      requestAnimationFrame(markOverflow);
    }

    $('#liunian').onclick = function(e){
      var el = e.target.closest('.ln');
      if(!el) return;
      selYear = +el.getAttribute('data-year');
      renderLiunian(out.dyList[curIdx]);
    };
    $('#liuyue').onclick = function(e){
      var el = e.target.closest('.ly');
      if(!el) return;
      selMonthIdx = +el.getAttribute('data-mi');
      paintLiuyue();
    };
    $('#liuri').onclick = function(e){
      var el = e.target.closest('.lr');
      if(!el) return;
      selDayIdx = +el.getAttribute('data-di');
      paintLiuri(curMonths[selMonthIdx], curDays);
    };

    function pick(e){
      var el = e.target.closest('.dy');
      if(!el) return;
      curIdx = +el.getAttribute('data-i');
      renderDayun();
    }
    $('#dayun').onclick = pick;
    $('#dayun').onkeydown = function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(e); }
    };

    renderDayun();
    requestAnimationFrame(markOverflow);

    $('#empty').classList.add('hidden');
    var res = $('#result');
    res.classList.remove('hidden');
    res.classList.remove('enter');
    void res.offsetWidth;
    res.classList.add('enter');

    requestAnimationFrame(function(){
      centerIn($('#dayun'), '.active');
      centerIn($('#liunian'), '.sel');
      centerIn($('#liuyue'), '.sel');
      centerIn($('#liuri'), '.sel');
      markOverflow();
      if(window.matchMedia('(max-width:880px)').matches){
        var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
        $('#meta').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      }
    });

    saveLastInputs();
  }

  // ---- 保存 ----
  var HKEY = 'paipan_history_v1', LKEY = 'paipan_last_v1';

  function readForm(){
    return {
      cal:state.cal, sex:state.sex,
      y:$('#y').value, m:$('#m').value, d:$('#d').value,
      hh:$('#hh').value, mm:$('#mm').value,
      leap:$('#leap').checked, lon:$('#lon').value,
      tst:$('#tst').checked, sect:$('#sect').value
    };
  }

  function applyForm(v){
    state.cal = v.cal; state.sex = v.sex;
    Array.prototype.forEach.call($('#calSeg').querySelectorAll('button'), function(b){ b.classList.toggle('on', b.getAttribute('data-v') === v.cal); });
    Array.prototype.forEach.call($('#sexSeg').querySelectorAll('button'), function(b){ b.classList.toggle('on', +b.getAttribute('data-v') === v.sex); });
    $('#leapWrap').style.display = v.cal === 'lunar' ? 'inline-flex' : 'none';
    $('#y').value = v.y; $('#m').value = v.m; $('#d').value = v.d;
    $('#hh').value = v.hh; $('#mm').value = v.mm;
    $('#leap').checked = !!v.leap;
    $('#lon').value = v.lon;
    $('#tst').checked = !!v.tst;
    $('#sect').value = v.sect;
  }

  function saveLastInputs(){
    try{ localStorage.setItem(LKEY, JSON.stringify(readForm())); }catch(e){}
  }

  $('#saveBtn').addEventListener('click', function(){
    if($('#result').classList.contains('hidden')){ alert('先排盘再保存'); return; }
    var label = (lastOut ? lastOut.pillars.map(function(p){ return p.gan + p.zhi; }).join(' ') : '命例') +
      ' · ' + (state.sex ? '男' : '女');
    var sub = ($('#y').value + '-' + $('#m').value + '-' + $('#d').value + ' ' + $('#hh').value + ':' + pad(+$('#mm').value || 0));
    var arr = [];
    try{ arr = JSON.parse(localStorage.getItem(HKEY) || '[]'); }catch(e){}
    arr.unshift({ label:label, sub:sub, form:readForm(), ts:Date.now() });
    arr = arr.slice(0, 40);
    localStorage.setItem(HKEY, JSON.stringify(arr));
    var btn = $('#saveBtn'), old = btn.textContent;
    btn.textContent = '已保存';
    setTimeout(function(){ btn.textContent = old; }, 1200);
  });

  $('#printBtn').addEventListener('click', function(){ window.print(); });

  $('#form').addEventListener('submit', function(e){
    e.preventDefault();
    try{ calc(); }
    catch(err){ alert(err.message || String(err)); }
  });

  (function restore(){
    var open = null;
    try{
      open = JSON.parse(localStorage.getItem('paipan_open') || 'null');
      localStorage.removeItem('paipan_open');
    }catch(e){}
    var v = null;
    try{ v = JSON.parse(localStorage.getItem(LKEY) || 'null'); }catch(e){}
    if(open){
      applyForm(open);
      try{ calc(); }catch(err){ alert(err.message || String(err)); }
      return;
    }
    if(v){ applyForm(v); }
    else { $('#y').value = 1990; $('#m').value = 1; $('#d').value = 1; }
  })();
})();
</script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('./sw.js');
}
</script>
